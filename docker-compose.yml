# One-command deployment:  docker compose up -d
# Shortly is then at http://localhost:3000. Links persist in the
# named volume `shortly-data`, so they survive container restarts.
# Set BASE_URL to the public address when deploying behind a domain.
services:
  shortly:
    build: .
    ports:
      - "3000:3000"
    environment:
      - BASE_URL=http://localhost:3000
    volumes:
      - shortly-data:/data
    restart: unless-stopped

volumes:
  shortly-data:
